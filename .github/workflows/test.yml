name: test

on:
  push:
  pull_request:

jobs:
  smoke:
    name: protocol contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: smoke test
        shell: pwsh
        run: pwsh -NoProfile -File tests/smoke.ps1

  source:
    name: source checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: parses as PowerShell
        shell: pwsh
        run: |
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/winbox-mcp.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors | ForEach-Object { Write-Host $_.Message }; exit 1 }
          Write-Host 'parses cleanly'
      - name: is pure ASCII
        # Windows PowerShell 5.1 reads a BOM-less file as the ANSI code page, so
        # one non-ASCII byte in this source is mojibake on a non-English host.
        # That is a silent, host-dependent failure; this check makes it loud.
        run: |
          if LC_ALL=C grep -nP '[^\x00-\x7F]' winbox-mcp.ps1; then
            echo "winbox-mcp.ps1 must be pure ASCII (see the comment above)"
            exit 1
          fi
          echo 'pure ASCII'
